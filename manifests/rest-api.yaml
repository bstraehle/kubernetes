apiVersion: v1
kind: ServiceAccount
metadata:
  name: rest-api
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rest-api
  labels:
    app.kubernetes.io/name: rest-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: rest-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rest-api
    spec:
      serviceAccountName: rest-api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # APP_UID of the .NET base image; the image itself doesn't set USER.
        runAsUser: 1654
        runAsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rest-api
          image: bstraehle/rest-api:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /Demo
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /Demo
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: rest-api-service
  labels:
    app.kubernetes.io/name: rest-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: rest-api
  ports:
    - name: http
      port: 8001
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: rest-api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rest-api
