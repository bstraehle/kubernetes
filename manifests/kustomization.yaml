apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: demo

resources:
  - namespace.yaml
  - rest-api.yaml
  - mvc-app.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: demo

# Pin versions or test other builds by changing newTag (or: kustomize edit set image ...).
images:
  - name: bstraehle/rest-api
    newTag: latest
  - name: bstraehle/mvc-app
    newTag: latest
