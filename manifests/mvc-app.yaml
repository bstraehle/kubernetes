apiVersion: v1
kind: ServiceAccount
metadata:
  name: mvc-app
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mvc-app
  labels:
    app.kubernetes.io/name: mvc-app
spec:
  # One replica: the app's antiforgery tokens are encrypted with a per-pod
  # data-protection key, so a form loaded from one replica fails (HTTP 400)
  # when submitted to another. Scaling out needs a shared key store.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mvc-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mvc-app
    spec:
      serviceAccountName: mvc-app
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # APP_UID of the .NET base image; the image itself doesn't set USER.
        runAsUser: 1654
        runAsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mvc-app
          image: bstraehle/mvc-app:latest
          imagePullPolicy: Always
          env:
            - name: DEMO_API_HOST
              value: http://rest-api-service:8001
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mvc-app-service
  labels:
    app.kubernetes.io/name: mvc-app
spec:
  # Exposed through a cloud load balancer; use "kubectl port-forward" on clusters without one.
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: mvc-app
  ports:
    - name: http
      port: 8000
      targetPort: http
